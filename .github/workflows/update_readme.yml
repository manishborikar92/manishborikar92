name: Update Dynamic README

on:
  # Run daily at 00:00 UTC (midnight UTC)
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
  # Run on push to main when README, script, or dependencies change
  push:
    branches: [main]
    paths:
      - "README.md"
      - "update_readme.py"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: readme-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Refresh projects & skills
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run updater script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_readme.py

      - name: Commit & push if README or stats changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md profile-stats/
          git diff --staged --quiet || git commit -m "chore: auto-update README & stats [skip ci]"
          git push
